services:
  agent:
    build:
      context: ./agent
    depends_on:
      - envoy
    networks:
      - agent_net
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    user: "65532:65532"
    restart: "no"
    # No direct route to the policy or upstream networks.

  envoy:
    image: envoyproxy/envoy:v1.40.2
    entrypoint: ["/usr/local/bin/envoy"]
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    user: "65532:65532"
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - opa
      - echo
    networks:
      - agent_net
      - policy_net
      - upstream_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.22.4-envoy-2
    command:
      - run
      - --server
      - --config-file=/config/opa.yaml
      - /policy/authz.rego
    volumes:
      - ./opa.yaml:/config/opa.yaml:ro
      - ./policy:/policy:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    networks:
      - policy_net
    restart: unless-stopped

  echo:
    build:
      context: ./echo
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    networks:
      - upstream_net
    restart: unless-stopped

networks:
  agent_net:
    internal: true
  policy_net:
    internal: true
  upstream_net:
    internal: true
