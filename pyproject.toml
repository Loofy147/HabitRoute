[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitroute"
version = "0.1.0.dev0"
description = "Research-to-engineering system for reusable, evidence-gated machine-operation patterns and persistent flows"
readme = "src/habitroute/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
spiffe = ["grpcio>=1.60,<2", "protobuf>=5.26,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
