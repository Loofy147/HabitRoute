[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitroute"
version = "0.1.0.dev0"
description = "Research-to-engineering system for reusable, evidence-gated machine-operation patterns and persistent flows"
readme = "src/habitroute/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
