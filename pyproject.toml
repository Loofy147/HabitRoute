[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitroute"
version = "0.1.0.dev0"
description = "Research prototype for evidence-backed adaptive skills and route memory"
readme = "src/habitroute/README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
