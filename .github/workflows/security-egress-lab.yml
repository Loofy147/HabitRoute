name: security-egress-lab

on:
  pull_request:
    paths:
      - "deploy/security-lab/**"
      - ".github/workflows/security-egress-lab.yml"
  push:
    branches: ["main"]
    paths:
      - "deploy/security-lab/**"
      - ".github/workflows/security-egress-lab.yml"

permissions:
  contents: read

jobs:
  egress-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated policy and upstream services
        run: docker compose -f deploy/security-lab/compose.yaml up --build --detach opa echo envoy
      - name: Run bounded agent egress assertions
        run: timeout --signal=TERM --kill-after=5s 90s docker compose -f deploy/security-lab/compose.yaml run --rm --no-deps agent
      - name: Collect service logs
        if: always()
        run: docker compose -f deploy/security-lab/compose.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f deploy/security-lab/compose.yaml down --volumes --remove-orphans
